name: godot

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cross-reference checks that do not need the engine: scene/script node
      # paths, res:// targets, input actions, autoloads, class_name collisions,
      # .new() on Node subclasses, data files.
      - name: Static project checks
        run: python3 tools/check_project.py

      # The level's platform spacing is checked against the player's actual jump
      # and dash numbers. This is arithmetic, not the engine, but it is the only
      # thing standing between "the level looks fine" and "the player is
      # trapped on the starting platform", which is exactly what shipped before.
      - name: Level traversal reachability
        run: |
          set -o pipefail
          python3 tools/simulate_traversal.py 2>&1 | tee traversal.log || true
          python3 - <<'PY'
          import re
          lines = open("traversal.log", encoding="utf-8", errors="replace").read().splitlines()
          bad = [l.strip() for l in lines if "UNREACHABLE" in l or "NO SURFACE" in l or "ABOVE REACH" in l]
          for line in bad[:20]:
              print("::error::" + line[:400])
          raise SystemExit(1 if bad else 0)
          PY

      # Prove the check above can actually fail, by re-injecting the geometry it
      # was written to catch. A check that only ever passes is not evidence.
      - name: Validate the traversal check catches the original bug
        run: python3 tools/validate_traversal_check.py

      - name: Download Godot (matches project feature tag 4.7)
        run: |
          set -e
          VERSION=4.7.2-stable
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -o godot.zip
          mv Godot_v${VERSION}_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      # A real engine load. Every .gd is parsed and every .tscn resolved, so
      # this is the check that actually validates the project rather than a
      # re-implementation of it. Any parse or resolution error is fatal.
      #
      # Errors are republished as check-run annotations because Actions log
      # storage is not always reachable from restricted networks, while
      # api.github.com annotations are.
      - name: Godot headless import (parses all scripts and scenes)
        run: |
          set -o pipefail
          ./godot --headless --path . --import 2>&1 | tee import.log || true
          python3 - <<'PY'
          import re
          # Print each error with the 2 preceding lines for context: Godot's
          # SCRIPT ERROR lines carry the file and line, but the surrounding
          # output is what identifies which script actually failed.
          def report(pattern, label, ctx=2, limit=40):
              pat = re.compile(pattern)
              hits = [i for i, l in enumerate(lines) if pat.search(l)]
              if not hits:
                  print(f"{label}: no errors reported.")
                  return True
              print(f"{label}: {len(hits)} error line(s).")
              emitted = set()
              for i in hits[:limit]:
                  for j in range(max(0, i - ctx), i + 1):
                      if j in emitted:
                          continue
                      emitted.add(j)
                      marker = "error" if j == i else "warning"
                      print(f"::{marker}::" + lines[j].strip()[:400])
              return False

          lines = open("import.log", encoding="utf-8", errors="replace").read().splitlines()
          ok = report(r"SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Failed loading resource|Invalid access to property", "Godot import")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Autoload boot smoke test
        if: always()
        run: |
          set -o pipefail
          # Runs the real autoload chain and Boot for a few frames, then quits.
          ./godot --headless --path . --quit-after 6 2>&1 | tee boot.log || true
          grep -F '[Nightmare Hunter] content loaded' boot.log || echo "::warning::content manifest line not printed"
          python3 - <<'PY'
          import re
          # Print each error with the 2 preceding lines for context: Godot's
          # SCRIPT ERROR lines carry the file and line, but the surrounding
          # output is what identifies which script actually failed.
          def report(pattern, label, ctx=2, limit=40):
              pat = re.compile(pattern)
              hits = [i for i, l in enumerate(lines) if pat.search(l)]
              if not hits:
                  print(f"{label}: no errors reported.")
                  return True
              print(f"{label}: {len(hits)} error line(s).")
              emitted = set()
              for i in hits[:limit]:
                  for j in range(max(0, i - ctx), i + 1):
                      if j in emitted:
                          continue
                      emitted.add(j)
                      marker = "error" if j == i else "warning"
                      print(f"::{marker}::" + lines[j].strip()[:400])
              return False

          lines = open("boot.log", encoding="utf-8", errors="replace").read().splitlines()
          ok = report(r"SCRIPT ERROR|Parse Error|Invalid access to property|Nonexistent function|Cannot call|Attempt to call", "Godot boot")
          raise SystemExit(0 if ok else 1)
          PY

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-export-templates-4.7.2.stable-v2

      - name: Install Godot and export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          VERSION=4.7.2-stable
          # The release tag uses a hyphen; the export-template directory Godot
          # looks in uses the dotted version. Getting this wrong produces
          # "No export template found at the expected path".
          TDIR=4.7.2.stable
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          curl -sSL -o /tmp/templates.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${TDIR}
          unzip -o -q /tmp/templates.zip -d /tmp/templates
          cp /tmp/templates/templates/* ~/.local/share/godot/export_templates/${TDIR}/
          ls -la ~/.local/share/godot/export_templates/${TDIR}/ | head -20

      - name: Install Godot editor binary
        run: |
          set -e
          VERSION=4.7.2-stable
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
          unzip -o -q /tmp/godot.zip
          mv Godot_v${VERSION}_linux.x86_64 godot
          chmod +x godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Report installed export templates
        run: |
          echo "--- template directories ---"
          ls -la ~/.local/share/godot/export_templates/ || echo "no export_templates directory"
          echo "--- web templates present ---"
          find ~/.local/share/godot/export_templates -name 'web*' -printf '%s\t%p\n' 2>/dev/null | sort || echo "none found"
          echo "--- godot version ---"
          ./godot --version

      - name: Export Web build
        run: |
          set -o pipefail
          mkdir -p export/web
          ./godot --headless --path . --export-release "Web" export/web/index.html 2>&1 | tee export.log || true
          python3 - <<'PY'
          import glob, os, re, subprocess
          lines = open("export.log", encoding="utf-8", errors="replace").read().splitlines()
          pat = re.compile(r"ERROR|error|Cannot|cannot|Failed|failed|Missing|missing|No export|not found|Unable")
          hits = [l.strip() for l in lines if pat.search(l)]
          produced = os.path.exists("export/web/index.html")

          # Diagnostics as annotations, since Actions log storage is unreachable
          # from restricted networks and annotations are the readable channel.
          home = os.path.expanduser("~")
          tdirs = sorted(glob.glob(f"{home}/.local/share/godot/export_templates/*"))
          web = sorted(glob.glob(f"{home}/.local/share/godot/export_templates/*/web*"))
          print("::notice::template dirs: " + (", ".join(tdirs) or "NONE"))
          print(f"::notice::web templates found: {len(web)}")
          for w in web[:12]:
              print("::notice::  " + os.path.basename(w))
          print("::notice::index.html produced: " + str(produced))
          if produced:
              print("::notice::build files: " + ", ".join(sorted(os.listdir("export/web"))))

          print(f"export log: {len(lines)} line(s), {len(hits)} matching error patterns")
          for line in hits[:40]:
              print("::error::" + line[:400])
          if produced and not hits:
              print("Export produced a build with no errors logged.")
          raise SystemExit(0 if produced and not hits else 1)
          PY

      - name: Assert OpenGame requirements on the build
        run: python3 tools/web_export_checks.py export/web

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Load the exported build in a real browser
        run: python3 tools/browser_smoke_test.py export/web artifacts

      - name: Upload build and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            export/web
            artifacts
          if-no-files-found: warn
